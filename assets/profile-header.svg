<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Sílvio Henrique — Founder &amp; Systems Builder | SilvOS Liquid Glass</title>
  <desc id="desc">A frosted-glass panel, soft cyan-blue reflections and the SilvOS mark over a midnight background.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071220"/><stop offset=".55" stop-color="#10263D"/><stop offset="1" stop-color="#0A1A2B"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EAFBFF"/><stop offset=".48" stop-color="#92CFFF"/><stop offset="1" stop-color="#7DE5EF"/></linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DDF8FF" stop-opacity=".16"/><stop offset=".5" stop-color="#7BAAD6" stop-opacity=".035"/><stop offset="1" stop-color="#71DCEB" stop-opacity=".08"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#75D3FF" stop-opacity=".4"/><stop offset=".6" stop-color="#559CE0" stop-opacity=".10"/><stop offset="1" stop-color="#559CE0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#B5E2F4" stroke-opacity=".055"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#night)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <circle cx="1003" cy="159" r="193" fill="url(#halo)"/>
  <ellipse cx="925" cy="28" rx="340" ry="68" fill="#88DFFF" opacity=".14" filter="url(#soft)"/>
  <rect x="30" y="28" width="1140" height="284" rx="24" fill="url(#pane)" stroke="#DDF8FF" stroke-opacity=".23"/>
  <path d="M54 57H690" stroke="#EDF9FF" stroke-opacity=".22"/>
  <path d="M64 274H682" stroke="url(#ice)" stroke-opacity=".42"/>
  <text x="68" y="86" fill="#B0E9FB" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="4.4" font-weight="700">FOUNDER / SYSTEMS BUILDER</text>
  <text x="64" y="164" fill="#F3FBFF" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="700" letter-spacing="1">SÍLVIO HENRIQUE</text>
  <text x="68" y="209" fill="#C0D7E5" font-family="Arial,Helvetica,sans-serif" font-size="19">Linux systems  ·  Local-first AI  ·  Developer tooling</text>
  <text x="68" y="254" fill="#A4E1FA" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="2.5">BUILDING SILVOS  /  LIQUID GLASS</text>
  <g transform="translate(977 171)">
    <circle r="128" fill="#AFECFF" fill-opacity=".035" stroke="#DFF8FF" stroke-opacity=".18"/>
    <circle r="100" fill="url(#pane)" stroke="#AEDBFF" stroke-opacity=".36"/>
    <ellipse rx="118" ry="59" transform="rotate(-30)" fill="none" stroke="#B0E8FF" stroke-opacity=".21"/>
    <circle r="72" fill="#8FD9FF" fill-opacity=".085" stroke="url(#ice)" stroke-width="1.4" stroke-opacity=".9"/>
    <path d="M-38 -33H39L22 -15H-22L-38 0H22L38 15H-39L-23 33H23" fill="none" stroke="url(#ice)" stroke-width="8" stroke-linejoin="miter"/>
    <circle cx="-115" cy="-70" r="4" fill="#D5F5FF"/><circle cx="118" cy="83" r="3" fill="#7EDFEF"/>
  </g>
  <text x="1148" y="304" text-anchor="end" fill="#A4C4D8" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2.3">SILVOS / 2026</text>
</svg>
