 <linearGradient id="bg" x2="1" y2="0"><stop stop-color="#0A1D32"/><stop offset=".55" stop-color="#173A55"/><stop offset="1" stop-color="#0B2138"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#E8FAFF" stop-opacity=".15"/><stop offset="1" stop-color="#87C7FF" stop-opacity=".045"/></linearGradient>
 <linearGradient id="line" x2="1" y2="0"><stop stop-color="#B5F2FF"/><stop offset="1" stop-color="#6FC8FF"/></linearGradient>
</defs>
<rect width="1200" height="184" rx="22" fill="url(#bg)"/>
<circle cx="1049" cy="75" r="140" fill="#78CFFF" opacity=".06"/>
