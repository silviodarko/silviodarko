<circle cx="82" cy="91" r="31" fill="#8ADFFF" fill-opacity=".12" stroke="#ABEDFF" stroke-opacity=".55"/>
<path d="M67 90 L78 101 L98 80" fill="none" stroke="#D7F8FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="136" y="68" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#9ADFFC" font-weight="700" letter-spacing="2.5">SILVOS DISTRIBUTION  /  INSTALLED BOOT LAB</text>
<text x="134" y="110" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#F0FAFF" font-weight="700">Alpha 0.3</text>
