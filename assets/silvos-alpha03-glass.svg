<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="184" viewBox="0 0 1200 184" role="img" aria-labelledby="title desc">
<title id="title">SilvOS Alpha 0.3 | installed QEMU UEFI VM verified</title>
<desc id="desc">Frosted-glass status panel: the private SilvOS Alpha 0.3 installed onto a disposable qcow2 virtual disk, booted without ISO, verified Niri, Noctalia, networking and silvos-cli, and preserved the sentinel disk SHA-256.</desc>
